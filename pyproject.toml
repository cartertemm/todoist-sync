[project]
name = "todoist-sync"
version = "0.1.0"
description = "Two-way sync between Todoist and an Excel workbook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"openpyxl>=3.1",
	"requests>=2.31",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
